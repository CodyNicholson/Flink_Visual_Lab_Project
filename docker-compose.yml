# Host ports default to the ones in the plan; override them with env vars
# (e.g. BACKEND_HOST_PORT=8090 docker compose up --build) if something else already uses them.
services:
  postgres:
    image: postgres:16-alpine
    container_name: flink-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: flinkuser
      POSTGRES_PASSWORD: flinkpassword
      POSTGRES_DB: flinkdb
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "max_replication_slots=4"
    volumes:
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flinkuser -d flinkdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: flink-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: flink-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic flink-orders-topic --partitions 3 --replication-factor 1

  # Standalone Flink cluster, kept for exploring the Flink Web UI on :8081.
  # The lab's job runs inside the Spring Boot backend (embedded MiniCluster) so its
  # operators can push telemetry straight to the SSE endpoint; its own dashboard is on :8082.
  flink-jobmanager:
    image: flink:1.19.1-scala_2.12-java17
    container_name: flink-jobmanager
    ports:
      - "${FLINK_CLUSTER_HOST_PORT:-8081}:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    volumes:
      - flink-shared-fs:/data/flink-fs

  flink-taskmanager:
    image: flink:1.19.1-scala_2.12-java17
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - flink-shared-fs:/data/flink-fs

  backend:
    build: ./backend
    container_name: flink-spring-backend
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
      - "${FLINK_EMBEDDED_UI_HOST_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flinkdb
      SPRING_DATASOURCE_USERNAME: flinkuser
      SPRING_DATASOURCE_PASSWORD: flinkpassword
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLINK_SHARED_DIR: /data/flink-fs
      FLINK_WEB_UI_PORT: 8082
    volumes:
      - flink-shared-fs:/data/flink-fs
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: flink-react-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      # Vite dev server proxies /api (REST + SSE) to the backend over the compose network
      API_PROXY_TARGET: http://backend:8080
      VITE_FLINK_EMBEDDED_UI_URL: http://localhost:${FLINK_EMBEDDED_UI_HOST_PORT:-8082}
      VITE_FLINK_CLUSTER_UI_URL: http://localhost:${FLINK_CLUSTER_HOST_PORT:-8081}
    depends_on:
      - backend

volumes:
  flink-shared-fs:
