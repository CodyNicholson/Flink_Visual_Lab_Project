server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so nginx starts even if the backend isn't up yet
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Relative redirects, so /flink-job -> /flink-job/ keeps the browser's https host
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change, so let browsers cache them
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: stream telemetry straight through, keep long-lived connections open
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Flink Web Dashboards (read-only). They use relative paths, so they work under a prefix;
    # the trailing slash is required for those paths to resolve.
    location = /flink-job { return 301 /flink-job/; }
    location /flink-job/ {
        set $flink_job_upstream http://backend:8082;
        rewrite ^/flink-job/(.*)$ /$1 break;
        proxy_pass $flink_job_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /flink-cluster { return 301 /flink-cluster/; }
    location /flink-cluster/ {
        set $flink_cluster_upstream http://flink-jobmanager:8081;
        rewrite ^/flink-cluster/(.*)$ /$1 break;
        proxy_pass $flink_cluster_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
