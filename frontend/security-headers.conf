# Included at server level AND in every location that has its own add_header: nginx drops the
# inherited add_header directives as soon as a location declares one.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Everything is served from this origin; the API is proxied under /api/. React sets inline styles
# through the CSSOM, which CSP allows, so style-src needs no 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
